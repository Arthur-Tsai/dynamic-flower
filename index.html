<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bright Bioluminescent Broad Heart Flower (X & Y Scaled)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #030008; /* Deep cosmic black */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <div style="
        position: absolute; 
        top: 40%; /* Positions it right below the heart center (which is at ~43%) */
        width: 100%; 
        text-align: center; 
        color: #ffffff; 
        font-family: 'Segoe UI', Arial, sans-serif; 
        font-size: 20px; 
        font-weight: 400;
        letter-spacing: 2px;
        z-index: 10;
        pointer-events: none; /* Allows mouse interactions to pass straight to the canvas */
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.6), 0 0 20px rgba(0, 240, 255, 0.4);
    ">
        Happy 520!
    </div>

    <canvas id="neonHeartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('neonHeartCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const config = {
            layers: 64,          // More layers create structural complexity
            baseScale: 15,       // Primary scale factor
            speed: 0.001         // Smooth, fluid animation time multiplier
        };

        function drawNeonFlower(time) {
            // Keep background highly transparent to stack glowing particle trails smoothly
            ctx.fillStyle = 'rgba(3, 0, 8, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            // Adjusted center Y alignment slightly to account for the extra vertical height
            const centerY = canvas.height / 7 * 3; 

            // Turn on additive blending so overlapping colors merge into pure bright white light
            ctx.globalCompositeOperation = 'screen';

            for (let l = 0; l < config.layers; l++) {
                const layerProgress = l / config.layers;
                const phaseOffset = l * 0.25;

                // Create distinct rhythm loops for X and Y scales
                const scaleX = 1 + Math.sin(time * 1.8 + phaseOffset) * 0.30;
                const scaleY = 1 + Math.cos(time * 1.4 + phaseOffset * 0.5) * 0.24;
                
                // Fine rotary rotation matrix to spin structural layers past each other
                const rotation = Math.sin(time * 0.3 + phaseOffset * 0.2) * 0.12;

                // High resolution loop to generate unbroken light filaments
                for (let angle = 0; angle <= Math.PI * 2; angle += 0.015) {
                    
                    // Parametric Heart Base Equations
                    let heartX = 16 * Math.pow(Math.sin(angle), 3);
                    let heartY = -(13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle));

                    // --- BROADNESS ADJUSTMENTS ---
                    const widthFactor = 0.60;   // Widens the lobes horizontally by 35%
                    const heightFactor = 0.70;  // Stretches the heart vertically by 25%
                    
                    heartX *= widthFactor;
                    heartY *= heightFactor;

                    // Scale adjustment
                    let xNew = heartX * config.baseScale * scaleX;
                    let yNew = heartY * config.baseScale * scaleY;

                    // Micro-oscillations to create thin ribbon filaments
                    const microWaves = Math.sin(angle * 8 + time * 3) * 1.2;
                    xNew += Math.cos(angle) * microWaves;
                    yNew += Math.sin(angle) * microWaves;

                    // Apply the rotation matrix layout
                    const finalX = centerX + (xNew * Math.cos(rotation) - yNew * Math.sin(rotation));
                    const finalY = centerY + (xNew * Math.sin(rotation) + yNew * Math.cos(rotation));

                    // MULTI-COLOR GRADIENT ENGINE
                    const globalHue = time * 25; 
                    const angleHue = (angle / (Math.PI * 2)) * 180;
                    const layerHueShift = layerProgress * 120;
                    const finalHue = (globalHue + angleHue + layerHueShift) % 360;

                    // Compute dynamic high-intensity saturation and alpha
                    const brightness = 60 + (1 - layerProgress) * 20; 
                    const alpha = 0.12 * (0.3 + layerProgress * 0.7);

                    // Draw the individual light filaments
                    ctx.fillStyle = `hsla(${finalHue}, 100%, ${brightness}%, ${alpha})`;
                    ctx.fillRect(finalX, finalY, 1.5, 1.5);
                    
                    // Faint ambient stardust particles
                    if (Math.random() < 0.004) {
                        ctx.fillStyle = `hsla(${(finalHue + 30) % 360}, 100%, 80%, 0.4)`;
                        const driftX = (Math.random() - 0.5) * 25;
                        const driftY = (Math.random() - 0.5) * 25;
                        ctx.fillRect(finalX + driftX, finalY + driftY, 1, 1);
                    }
                }
            }

            ctx.globalCompositeOperation = 'source-over';
            requestAnimationFrame(animate);
        }

        function animate(timestamp) {
            drawNeonFlower(timestamp * config.speed);
        }

        requestAnimationFrame(animate);
    </script>
</body>
</html>
